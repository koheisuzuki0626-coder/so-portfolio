name: Sync YouTube videos

on:
  schedule:
    # 6時間ごと(UTC)。GitHub 側の混雑を避けるため 0 分ちょうどは外す
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youtube.config.json'
      - 'scripts/fetch-youtube.mjs'
      - '.github/workflows/sync-youtube.yml'

concurrency:
  group: sync-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest videos
        run: node scripts/fetch-youtube.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore: sync latest YouTube videos"
          git push

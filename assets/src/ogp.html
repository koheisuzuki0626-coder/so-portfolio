<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f5f5f7;
  font-family:"Inter","Zen Kaku Gothic New",sans-serif;color:#1d1d1f;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:66px 86px 60px;position:relative;overflow:hidden}
.glow{position:absolute;inset:-30% -10% auto auto;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(176,135,51,.16),rgba(176,135,51,0) 62%)}
.mark{font-size:38px;font-weight:500;letter-spacing:.01em;position:relative;
  display:flex;align-items:center;gap:.42em}
.mark img{height:1.62em;width:auto}
.mark .w{display:flex;align-items:baseline}
.mark i{width:.235em;height:.235em;margin-left:.075em;border-radius:50%;
  background:#b08733;transform:translateY(-.01em)}
.badge{display:inline-block;margin-top:26px;font-size:19px;letter-spacing:.14em;
  color:#856420;border:1px solid rgba(176,135,51,.4);border-radius:980px;padding:9px 22px}
h1{font-size:98px;font-weight:300;line-height:1.16;letter-spacing:-.015em;position:relative}
h1 em{font-style:normal;color:#856420}
.chips{display:flex;gap:14px;position:relative}
.chips li{list-style:none;font-size:21px;font-weight:400;background:#fff;white-space:nowrap;
  border:1px solid rgba(0,0,0,.1);border-radius:980px;padding:11px 22px}
.chips li::before{content:"✓";color:#856420;margin-right:10px}
.foot{display:flex;flex-direction:column;gap:20px;align-items:flex-start;position:relative}
.url{font-size:19px;color:#6e6e73;letter-spacing:.02em;white-space:nowrap}
</style></head><body>
<div class="glow"></div>
<div>
  <div class="mark"><img src="/assets/logo-mark.png" alt=""><span class="w">so<i></i></span></div>
  <div class="badge">AI VIDEO PRODUCTION</div>
</div>
<h1>撮影しない、<br><em>映像制作</em>。</h1>
<div class="foot">
  <ul class="chips">
    <li>社内調整がいらない</li><li>現場に出なくていい</li><li>撮り直しが発生しない</li>
  </ul>
  <div class="url">koheisuzuki0626-coder.github.io/so-portfolio</div>
</div>
</body></html>

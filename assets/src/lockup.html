<!doctype html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{font-family:Inter,sans-serif;padding:0}
.lock{display:inline-flex;align-items:center;gap:.42em;font-size:200px;font-weight:500;
  letter-spacing:.01em;line-height:1;padding:24px}
.lock img{height:1.62em;width:auto;transform:translateY(.02em)}
.w{display:inline-flex;align-items:baseline}
.w i{flex:none;width:.235em;height:.235em;margin-left:.075em;border-radius:50%;
  background:#b08733;transform:translateY(-.01em)}
.light .w{color:#1d1d1f}
.dark .w{color:#f5f5f7}
.dark .w i{background:#d9b45f}
</style></head><body>
<span class="lock light" id="light"><img src="/assets/logo-mark.png" alt=""><span class="w">so<i></i></span></span>
<span class="lock dark" id="dark"><img src="/assets/logo-mark.png" alt=""><span class="w">so<i></i></span></span>
</body></html>

<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body{
    width:1080px; height:1920px; overflow:hidden; position:relative;
    background:
      radial-gradient(120% 80% at 50% 0%, #0e1e30 0%, #0a1524 45%, #070f1a 100%);
    font-family:'Hiragino Sans','Helvetica Neue',Arial,sans-serif;
  }
  /* 上部の閃光（青の輝き＋赤の滲み） */
  .glow-blue{
    position:absolute; left:470px; top:390px; width:560px; height:560px;
    border-radius:50%; filter:blur(60px);
    background:radial-gradient(circle,#3d9ae8 0%, rgba(45,120,200,.55) 40%, rgba(20,60,110,0) 70%);
  }
  .glow-red{
    position:absolute; left:660px; top:560px; width:400px; height:400px;
    border-radius:50%; filter:blur(55px);
    background:radial-gradient(circle,#e86a5a 0%, rgba(200,70,60,.45) 45%, rgba(120,40,40,0) 72%);
  }
  .core{
    position:absolute; left:826px; top:764px; width:30px; height:30px;
    border-radius:50%; background:#fff; box-shadow:0 0 26px 10px rgba(255,255,255,.55);
  }
  /* 砕けて飛ぶ光の筋 */
  .streak{ position:absolute; height:3px; background:linear-gradient(90deg,rgba(255,255,255,0),#eaf4ff);
           transform-origin:left center; border-radius:2px; }
  /* 砕けた破片（角丸バー） */
  .shard{
    position:absolute; border-radius:22px;
    background:linear-gradient(160deg,#67b4f5 0%,#2f86dd 100%);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  /* 下部のテキスト。下端から十分に余白を取る（切れないように） */
  .copy{ position:absolute; left:84px; bottom:150px; width:912px; }
  .rule{ width:104px; height:7px; background:#e8433f; border-radius:4px; margin-bottom:26px; }
  .kicker{ font-size:36px; font-weight:800; letter-spacing:.14em; color:#4da3f0; margin-bottom:18px; }
  h1{ font-size:132px; line-height:1.02; font-weight:900; color:#fff; letter-spacing:-.025em; }
  .sub{ margin-top:30px; font-size:36px; font-weight:600; color:#8fb6d8; letter-spacing:.01em; }
</style>

<div class="glow-blue"></div>
<div class="glow-red"></div>
<div class="core"></div>

<div class="streak" style="left:600px; top:600px; width:230px; transform:rotate(-22deg);"></div>
<div class="streak" style="left:610px; top:700px; width:330px; transform:rotate(-6deg);"></div>
<div class="streak" style="left:640px; top:440px; width:300px; transform:rotate(-38deg);"></div>
<div class="streak" style="left:600px; top:830px; width:260px; transform:rotate(16deg);"></div>

<div class="shard" style="left:62px;  top:1108px; width:280px; height:64px; transform:rotate(-4deg);"></div>
<div class="shard" style="left:382px; top:1018px; width:250px; height:64px; transform:rotate(-9deg);"></div>
<div class="shard" style="left:660px; top:1132px; width:212px; height:58px; transform:rotate(-7deg);"></div>
<div class="shard" style="left:872px; top:1058px; width:96px;  height:44px; transform:rotate(-15deg); opacity:.75;"></div>

<div class="copy">
  <div class="rule"></div>
  <div class="kicker">NOTHING DID.</div>
  <h1>It breaks<br>through.</h1>
  <div class="sub">The bottleneck cracks. The flow returns.</div>
</div>
